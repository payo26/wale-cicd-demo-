name: Maydoy Vm Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: maydoy_production    
    outputs:
      vm_ip: ${{ steps.tf_output.outputs.vm_ip }}

    permissions:
      id-token: write
      contents: read
   
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.WALE_AZURE_CREDENTIALS }}      
          client-secret: ${{ secrets.AZURE_CLIENT_SECTRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WALE_SUBSCRIPTION_ID }}

      - uses: actions/checkout@v3
      
      - uses: hashicorp/setup-terraform@v3

      - name: Prepare SSH public key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa.pub

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var="subscription_id=${{ secrets.WALE_SUBSCRIPTION_ID }}" -out="maydoy.tfplan"

      - name: Terraform Apply
        run: terraform apply -auto-approve maydoy.tfplan

      - name: Terraform Output
        id: tf_output
        run: echo "vm_ip=$(terraform output -raw vm_ip)" >> "$GITHUB_OUTPUT"

  configure:
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Wait for VM to be ready
        run: |
          for i in $(seq 1 10); do
            if ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa azureuser@${{ needs.provision.outputs.vm_ip }} 'sudo apt update && sudo apt install -y nginx'; then
              exit 0
            fi
            sleep 30
          done
          exit 1
                                
                                
                    


                
  
  

 
